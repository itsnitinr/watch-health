[versions]
# AGP 9 ships built-in Kotlin; the Kotlin version below only pins the Compose compiler plugin
# and must match the Kotlin Gradle plugin AGP bundles (2.2.10 for AGP 9.4.0).
agp = "9.4.0"
kotlin = "2.2.10"
compileSdk = "37"
minSdk = "28"
targetSdk = "37"

healthConnect = "1.2.0-alpha06"
work = "2.12.0"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"

[libraries]
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
